name: Build and deploy eZ Converter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Checkout converter engine
        uses: actions/checkout@v4
        with:
          repository: joshuafitzmorris/decant
          path: converter-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: converter-source/package-lock.json

      - name: Customize eZ Converter
        working-directory: converter-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          def edit(path, old, new):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise RuntimeError(f"Expected text not found in {path}: {old[:70]}")
              p.write_text(s.replace(old, new))

          # Replace the old brand throughout the app.
          for folder in ["src", "public"]:
              base = root / folder
              if base.exists():
                  for p in base.rglob("*"):
                      if p.is_file() and p.suffix in [
                          ".tsx", ".ts", ".html", ".json", ".txt", ".svg"
                      ]:
                          try:
                              s = p.read_text()
                              p.write_text(s.replace("Decant", "eZ Converter"))
                          except UnicodeDecodeError:
                              pass

          # Main HTML metadata.
          edit(
              "index.html",
              "Decant: convert files without uploading them",
              "eZ Converter - Free Online Audio, Video, Image & Document Converter"
          )

          edit(
              "index.html",
              "A free converter for images, audio, video, documents, ebooks and spreadsheets. It runs in your browser, so your files never leave your device.",
              "Free Online Audio, Video, Image & Document Converter. Convert files directly in your browser."
          )

          edit(
              "index.html",
              '<meta name="color-scheme" content="light dark" />',
              '<meta name="color-scheme" content="light dark" />\n'
              '<script>try{const t=localStorage.getItem("ez-theme");'
              'if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;}catch(e){}</script>'
          )

          # PWA details.
          edit(
              "vite.config.ts",
              "description: 'Convert files in your browser. Nothing is uploaded.'",
              "description: 'Free Online Audio, Video, Image & Document Converter.'"
          )

          # Replace the header with eZ Converter branding and theme switch.
          header = """import { useEffect, useState } from 'react';
          import { Mark } from './icons';

          export const REPO_URL = 'https://github.com/kalanapradeep14-cloud/FreeAudioConverter';
          export const SUPPORT_URL = '';
          export const AUTHOR_URL = '';
          export const AUTHOR_GITHUB_URL = '';

          const navLink = 'inline-flex h-9 items-center rounded-field px-2.5 text-ink-2 transition-colors hover:text-ink';

          export function Header() {
            const [theme, setTheme] = useState<'light' | 'dark'>(
              typeof document !== 'undefined' && document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'
            );

            useEffect(() => {
              document.documentElement.dataset.theme = theme;
              try { localStorage.setItem('ez-theme', theme); } catch {}
            }, [theme]);

            return (
              <header className="flex min-h-[4.5rem] items-center justify-between gap-3 py-3 sm:min-h-20">
                <a href={import.meta.env.BASE_URL}
                  className="flex items-center gap-2 text-xl font-extrabold tracking-tight text-ink">
                  <Mark />
                  eZ Converter
                </a>
                <nav aria-label="Site" className="flex items-center gap-1 sm:gap-2">
                  <a href="#how" className={`${navLink} max-md:hidden`}>How it works</a>
                  <a href="#formats" className={`${navLink} max-md:hidden`}>Formats</a>
                  <button
                    type="button"
                    onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                    aria-label="Switch colour theme"
                    className="inline-flex h-9 items-center gap-2 rounded-full border border-rule-strong bg-surface px-3 font-semibold text-ink"
                  >
                    {theme === 'dark' ? '☀ Light' : '☾ Dark'}
                  </button>
                </nav>
              </header>
            );
          }

          export function SupportLink() {
            return null;
          }
          """

          (root / "src/app/Header.tsx").write_text(header)

          # Brand subtitle on the home page.
          edit(
              "src/app/Intro.tsx",
              '<div className="mt-[clamp(2rem,6vh,3.5rem)] grid gap-x-8',
              '<p className="mb-7 text-center text-sm font-semibold tracking-wide text-ink-2 sm:text-base">'
              'Free Online Audio, Video, Image &amp; Document Converter'
              '</p>\n'
              '<div className="mt-[clamp(2rem,6vh,3.5rem)] grid gap-x-8'
          )

          # Brand and privacy text in the footer.
          p = root / "src/app/Footer.tsx"
          s = p.read_text()

          s = s.replace(
              "Made in Vancouver by",
              "Powered by an open-source conversion engine, originally created by"
          )

          s = s.replace(
              "No ads, no tracking",
              "Privacy and transparency"
          )

          s = s.replace(
              "Decant reads your files, converts them with WebAssembly and your device’s own media encoders, and hands the results straight back. There’s no server to upload to, and the page’s security policy blocks connections to other sites.",
              "Your selected files are processed in your browser using WebAssembly and your device's media encoders."
          )

          s = s.replace(
              "Decant has no analytics, cookies or accounts, and doesn’t know who you are or what you convert.",
              "This website may display advertising. Please read our Privacy Policy for details."
          )

          s = s.replace(
              "How does it make money? It doesn’t. If it saved you some hassle, a coffee is always welcome.",
              "eZ Converter is free to use. Advertising may help support this website."
          )

          s = s.replace(
              '<SupportLink className="mt-5" />',
              ''
          )

          s = s.replace(
              "Joshua Fitz-Morris",
              "the original project creator"
          )

          s = s.replace(
              "Joshua on GitHub",
              "Original project"
          )

          # Add navigation links.
          s = s.replace(
              '</footer>',
              """
                <nav style={{padding:'20px 0',display:'flex',gap:'20px',flexWrap:'wrap'}}>
                  <a href={`${import.meta.env.BASE_URL}about/`}>About</a>
                  <a href={`${import.meta.env.BASE_URL}privacy/`}>Privacy Policy</a>
                  <a href={`${import.meta.env.BASE_URL}terms/`}>Terms of Use</a>
                  <a href={`${import.meta.env.BASE_URL}contact/`}>Contact</a>
                </nav>
              </footer>
              """
          )

          p.write_text(s)

          # International colour palette and manual theme support.
          css = root / "src/styles/index.css"
          s = css.read_text()

          s = s.replace("--paper: #f2f4f3;", "--paper: #f5f9ff;")
          s = s.replace("--surface: #ffffff;", "--surface: #ffffff;")
          s = s.replace("--sunk: #e8ecea;", "--sunk: #e5f0ff;")
          s = s.replace("--ink: #0f1a17;", "--ink: #102a56;")
          s = s.replace("--ink-2: #47544f;", "--ink-2: #456080;")
          s = s.replace("--ink-3: #66726d;", "--ink-3: #7186a2;")
          s = s.replace("--on-ink: #f2f4f3;", "--on-ink: #ffffff;")

          s += """

          /* eZ Converter manual theme colours */
          :root[data-theme="light"] {
            color-scheme: light;
            --paper: #f5f9ff;
            --surface: #ffffff;
            --sunk: #e5f0ff;
            --ink: #102a56;
            --ink-2: #456080;
            --ink-3: #7186a2;
            --rule: rgb(16 42 86 / 0.1);
            --rule-strong: rgb(16 42 86 / 0.2);
            --on-ink: #ffffff;
          }

          :root[data-theme="dark"] {
            color-scheme: dark;
            --paper: #081426;
            --surface: #10233d;
            --sunk: #193657;
            --ink: #edf6ff;
            --ink-2: #b5cce5;
            --ink-3: #8da9c8;
            --rule: rgb(220 240 255 / 0.12);
            --rule-strong: rgb(220 240 255 / 0.24);
            --on-ink: #081426;
          }

          a {
            transition: color 150ms ease;
          }
          """

          css.write_text(s)

          # Create website information pages.
          pages = {
            "about": (
              "About eZ Converter",
              "eZ Converter is a free online audio, video, image and document converter. "
              "It helps users convert files directly in their browser. "
              "The conversion engine is based on the open-source Decant project."
            ),
            "privacy": (
              "Privacy Policy",
              "Files selected for conversion are processed in your browser. "
              "They are not uploaded to an eZ Converter conversion server. "
              "The hosting provider may collect technical information such as IP addresses. "
              "If advertising services such as Google AdSense are used, cookies or similar "
              "technologies may be used to provide and measure advertisements. "
              "This policy may be updated when the website changes."
            ),
            "terms": (
              "Terms of Use",
              "eZ Converter is provided free of charge and without warranty. "
              "Conversion results depend on your device, browser and selected file. "
              "You are responsible for ensuring that you have the right to use and convert "
              "the files you select. Do not use this service for unlawful purposes."
            ),
            "contact": (
              "Contact",
              "For questions, suggestions or to report a problem, please contact us "
              "through the website's GitHub repository."
            )
          }

          for slug, (title, body) in pages.items():
              d = root / "public" / slug
              d.mkdir(parents=True, exist_ok=True)

              extra = '<p><a href="../">Back to eZ Converter</a></p>'

              if slug == "contact":
                  extra = (
                    '<p><a href="https://github.com/kalanapradeep14-cloud/FreeAudioConverter/issues">'
                    'Contact / Report an issue</a></p>' + extra
                  )

              html = f"""<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="description" content="{body}">
          <title>{title} - eZ Converter</title>
          <style>
          body {{
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.8;
            background: #f5f9ff;
            color: #102a56;
          }}
          a {{ color: #008fc7; }}
          </style>
          </head>
          <body>
          <h1>{title}</h1>
          <p>{body}</p>
          {extra}
          </body>
          </html>"""

              (d / "index.html").write_text(html)

          print("eZ Converter customization complete.")
          PY

      - name: Install dependencies
        working-directory: converter-source
        run: npm ci

      - name: Build website
        working-directory: converter-source
        env:
          BASE_PATH: /FreeAudioConverter/
          SITE_URL: https://kalanapradeep14-cloud.github.io/FreeAudioConverter/
        run: |
          npm run build
          cp LICENSE dist/THIRD-PARTY-DECANT-LICENSE.txt

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: converter-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
