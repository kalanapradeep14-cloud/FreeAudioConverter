name: Build and deploy FreeAudioConverter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Check out converter engine
        uses: actions/checkout@v4
        with:
          repository: joshuafitzmorris/decant
          path: converter-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: converter-source/package-lock.json

      - name: Customize FreeAudioConverter
        working-directory: converter-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          for folder in ["src", "public"]:
              base = root / folder
              if base.exists():
                  for p in base.rglob("*"):
                      if p.is_file() and p.suffix in [".tsx", ".ts", ".html", ".json", ".txt", ".svg"]:
                          try:
                              s = p.read_text()
                              p.write_text(s.replace("Decant", "FreeAudioConverter"))
                          except UnicodeDecodeError:
                              pass

          p = root / "index.html"
          s = p.read_text()
          s = s.replace(
              "Decant: convert files without uploading them",
              "FreeAudioConverter - Free Online Audio and Video Converter"
          )
          s = s.replace(
              "A free converter for images, audio, video, documents, ebooks and spreadsheets. It runs in your browser, so your files never leave your device.",
              "Convert audio and video files online for free. Convert MP3, WAV, MP4 and many other formats directly in your browser."
          )
          s = s.replace('content="Decant"', 'content="FreeAudioConverter"')
          p.write_text(s)

          p = root / "vite.config.ts"
          s = p.read_text().replace(
              "Convert files in your browser. Nothing is uploaded.",
              "Free online audio and video converter."
          )
          p.write_text(s)

          p = root / "src/app/Header.tsx"
          s = p.read_text()
          s = s.replace(
              "inline-flex h-9 items-center gap-2 rounded-full border border-rule-strong bg-surface px-3.5 font-[600]",
              "inline-flex h-9 whitespace-nowrap items-center gap-1 rounded-full border border-rule-strong bg-surface px-2 text-[0.65rem] font-[600] sm:gap-2 sm:px-3.5 sm:text-base"
          )
          p.write_text(s)

          p = root / "src/app/Footer.tsx"
          s = p.read_text()
          s = s.replace(
              "No ads, no tracking",
              "Privacy and transparency"
          )
          s = s.replace(
              "FreeAudioConverter has no analytics, cookies or accounts, and doesn’t know who you are or what you convert.",
              "The converter does not require an account. This website may display advertising. Please read our Privacy Policy for details."
          )
          s = s.replace(
              "There’s no server to upload to, and the page’s security policy blocks connections to other sites.",
              "Your selected files are processed in your browser rather than uploaded to a FreeAudioConverter conversion server."
          )
          s = s.replace(
              "Made in Vancouver by",
              "Powered by an open-source conversion engine, originally created by"
          )
          s = s.replace(
              "FreeAudioConverter is free",
              "FreeAudioConverter is free"
          )
          s = s.replace(
              "How does it make money? It doesn’t. If it saved you some hassle, a coffee is always welcome.",
              "This website is free to use. If it saved you some hassle, a coffee is always welcome."
          )
          s = s.replace(
              "</footer>",
              """
                <nav style={{padding:'20px 0',display:'flex',gap:'20px',flexWrap:'wrap'}}>
                  <a href={`${import.meta.env.BASE_URL}about/`}>About</a>
                  <a href={`${import.meta.env.BASE_URL}privacy/`}>Privacy Policy</a>
                  <a href={`${import.meta.env.BASE_URL}terms/`}>Terms of Use</a>
                  <a href={`${import.meta.env.BASE_URL}contact/`}>Contact</a>
                </nav>
              </footer>
              """
          )
          p.write_text(s)

          p = root / "src/core/seo.ts"
          s = p.read_text()
          s = s.replace(
              "Yes. There are no ads, no paid tier, no account and no limit on how many files you convert. The code is open source under the MIT licence.",
              "Yes. The converter is free to use and does not require an account. This website may display advertising. The conversion engine is open source under the MIT licence."
          )
          s = s.replace(
              "and there are no ads, accounts or size limits",
              "and no account is required"
          )
          s = s.replace(
              "Nothing is uploaded, and there are no ads, accounts or size limits.",
              "Files are processed in your browser, and no account is required."
          )
          p.write_text(s)

          pages = {
          "about": ("About FreeAudioConverter", "FreeAudioConverter is a free online file conversion website. It helps users convert audio and video files using their browser. The conversion engine is based on the open-source Decant project by Joshua Fitz-Morris."),
          "privacy": ("Privacy Policy", "FreeAudioConverter processes selected media files in your browser and does not upload them to a FreeAudioConverter conversion server. The website is hosted by GitHub Pages, which may collect technical information such as IP address and browser details in its server logs. If advertising services such as Google AdSense are added, they may use cookies or similar technologies. This policy may be updated when the website changes."),
          "terms": ("Terms of Use", "FreeAudioConverter is provided free of charge and without warranty. Conversion results depend on your device, browser and selected file. You are responsible for ensuring that you have the right to use and convert the files you select. Do not use this service for unlawful purposes. Some formats may not work on every device."),
          "contact": ("Contact", "For questions, suggestions or to report a problem, please contact the website owner through the GitHub repository. Do not upload private or personal media files when reporting an issue.")
          }

          for slug, (title, body) in pages.items():
              d = root / "public" / slug
              d.mkdir(parents=True, exist_ok=True)
              extra = '<p><a href="../">Back to FreeAudioConverter</a></p>'
              if slug == "contact":
                  extra = '<p><a href="https://github.com/kalanapradeep14-cloud/FreeAudioConverter/issues">Contact / Report an issue on GitHub</a></p><p><a href="../">Back to FreeAudioConverter</a></p>'
              html = f"""<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>{title} - FreeAudioConverter</title>
          <style>
          body{{font-family:Arial,sans-serif;max-width:760px;margin:50px auto;padding:20px;line-height:1.7;color:#222}}
          a{{color:#087b65}}
          </style>
          </head>
          <body>
          <h1>{title}</h1>
          <p>{body}</p>
          {extra}
          </body>
          </html>"""
              (d / "index.html").write_text(html)

          print("FreeAudioConverter customization complete.")
          PY

      - name: Install dependencies
        working-directory: converter-source
        run: npm ci

      - name: Build website
        working-directory: converter-source
        env:
          BASE_PATH: /FreeAudioConverter/
          SITE_URL: https://kalanapradeep14-cloud.github.io/FreeAudioConverter/
        run: |
          npm run build
          cp LICENSE dist/THIRD-PARTY-DECANT-LICENSE.txt

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: converter-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
